<script>
/* ============ i18n ============ */
const I18N = {
  ko:{ reviews:"후기", write:"후기 쓰기", heroTitle:'당신의 파이터, <span class="hl">어디까지</span> 키웠나요?',

    statReviews:"후기", statAvg:"평균 별점", writeReview:"✍️ 후기 남기기", play:"🎮 게임 플레이",

    okSubmit:"후기가 등록됐어요! 고마워요 🥊", errCooldown:"잠시 후 다시 등록할 수 있어요 (스팸 방지).",
    errFields:"별점·닉네임·후기를 모두 채워주세요.", errBig:"파일이 너무 큽니다.", uploading:"등록 중...",

    tBadge:"번역됨 · 원문 보기", tBadgeOrig:"원문 · 번역 보기" },
  en:{ reviews:"Reviews", write:"Write", heroTitle:'How far did <span class="hl">you</span> take your fighter?',
    heroSub:"Real reviews from Rising-fighter players. Share your story too.",
    statReviews:"Reviews", statAvg:"Avg rating", writeReview:"✍️ Write a review", play:"🎮 Play the game",
    sortNew:"Newest", sortTop:"Top rated", sortMedia:"With media", modalTitle:"Write a review",
    modalSub:"No login needed! Add a photo and your review might be featured on Instagram 📸",
    fRating:"Rating", fNick:"Nickname", fBody:"Your review", fMedia:"Photo / Video (optional)",
    dropMain:"📷 Add a photo (video too)", dropHint:"Photo preferred · photo ≤10MB / video ≤50MB",
    submit:"Post review", noteSpam:"One review per device per cooldown period.",
    capTitle:"Instagram card", capSub:"Save as PNG for your story, post, or reel.", capSave:"📥 Save image",
    empty:"No reviews yet. Be the first! 🥊", card:"📸 Card", share:"🔗 Share",

    errFields:"Please fill rating, nickname and review.", errBig:"File too large.", uploading:"Posting...",
    copied:"Link copied!",
    tBadge:"Translated · Show original", tBadgeOrig:"Original · Show translation" }
};

/* 첫 진입 언어 (CEO DECISIONS #51): 저장값이 있으면 그 값, 없으면
   navigator.languages[0] 가 ko* 이거나 타임존이 Asia/Seoul 일 때만 KO, 그 밖은 전부 EN. */
const LANG_KEY = 'rf-reviews-lang';
function savedLang(){
  try{
    const v = localStorage.getItem(LANG_KEY) || localStorage.getItem('rf_lang'); // 구 키 마이그레이션
    if (v === 'ko' || v === 'en') return v;
  }catch(e){}
  return null;
}
function detectLang(){
  const s = savedLang(); if (s) return s;
  let ko = false;
  try{
    const ls = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
    if (String(ls[0]||'').toLowerCase().startsWith('ko')) ko = true;
  }catch(e){}
  try{
    if (Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Seoul') ko = true;
  }catch(e){}
  return ko ? 'ko' : 'en';
}
let LANG = detectLang();
function t(k){ return (I18N[LANG]&&I18N[LANG][k])||k; }
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n'); el.innerHTML = t(k);
  });
  document.getElementById('langBtn').textContent = LANG==='ko'?'EN':'한';
  render();
}

/* ============ Data layer: Supabase OR demo(localStorage) ============ */
const CONFIGURED = !SUPABASE_URL.includes('YOUR_PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR_ANON');
let sb = null;
if (CONFIGURED) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const Store = {
  async list(){
    if (CONFIGURED){
      // 번역 캐시 컬럼(lang, body_en/nick_en, body_ko/nick_ko)까지 함께 읽는다.
      const COLS = 'id, created_at, nickname, rating, body, media_url, media_type, lang, body_en, nick_en, body_ko, nick_ko';
      const { data, error } = await sb.from('reviews').select(COLS).order('created_at',{ascending:false}).limit(300);
      if (error){ console.error(error); return []; }
      return data;
    } else {
      return JSON.parse(localStorage.getItem('rf_reviews')||'[]');
    }
  },
  async add(r, file){
    let media_url=null, media_type=null;
    if (file){
      media_type = file.type.startsWith('video')?'video':'image';
      if (CONFIGURED){
        const path = Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+file.name.replace(/[^\w.\-]/g,'');
        const { error:upErr } = await sb.storage.from('review-media').upload(path, file, {cacheControl:'3600'});
        if (upErr) throw upErr;
        media_url = sb.storage.from('review-media').getPublicUrl(path).data.publicUrl;
      } else {
        media_url = await fileToDataURL(file); // demo only
      }
    }
    const row = { nickname:r.nickname, rating:r.rating, body:r.body, media_url, media_type, device_id:deviceId() };
    if (CONFIGURED){
      const { error } = await sb.from('reviews').insert(row); if (error) throw error;
    } else {
      const all = JSON.parse(localStorage.getItem('rf_reviews')||'[]');
      row.id = crypto.randomUUID(); row.created_at = new Date().toISOString();
      all.unshift(row); localStorage.setItem('rf_reviews', JSON.stringify(all));
    }
  }
};
function fileToDataURL(f){ return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f);}); }
function deviceId(){ let d=localStorage.getItem('rf_device'); if(!d){d=crypto.randomUUID();localStorage.setItem('rf_device',d);} return d; }

/* ============ Render ============ */
let REVIEWS = [], SORT='new';
function fmtDate(s){ const d=new Date(s); return d.toLocaleDateString(LANG==='ko'?'ko-KR':'en-US',{month:'short',day:'numeric'}); }
function stars(n){ return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ 번역본 표시 (CEO DECISIONS #51) ============
   표시값 = body_<현재언어> ?? 원문. 원문이 이미 현재 언어면 원문 그대로·배지 없음.
   번역본이 없는 후기는 translate-review 함수로 20개씩 채워 부분 재렌더. */
const TRANS_FN = SUPABASE_URL + '/functions/v1/translate-review';
const REQUESTED = { ko:new Set(), en:new Set() };   // 이미 요청한 id (중복 호출 방지)
const SHOW_ORIG = new Set();                        // 카드별 '원문 보기' 토글
function transOff(){ try{ return sessionStorage.getItem('rf-reviews-notrans')==='1'; }catch(e){ return TRANS_OFF_MEM; } }
let TRANS_OFF_MEM = false;
function setTransOff(){ TRANS_OFF_MEM = true; try{ sessionStorage.setItem('rf-reviews-notrans','1'); }catch(e){} }

// 엣지 함수와 동일한 휴리스틱 — 한글이 라틴 문자보다 많으면 ko.
function guessLang(s){
  s = s || '';
  const ko = (s.match(/[가-힣]/g)||[]).length, en = (s.match(/[A-Za-z]/g)||[]).length;
  if (ko===0 && en===0) return 'other';
  return ko>=en ? 'ko' : 'en';
}
function rowLang(r){ return r.lang || guessLang((r.body||'')+' '+(r.nickname||'')); }
// 원문이 이미 표시 언어이거나 판별 불가면 번역하지 않는다.
function isNative(r,L){ const g=rowLang(r); return g===L || g==='other'; }
function transOf(r,L){
  const b = L==='en' ? r.body_en : r.body_ko;
  const n = L==='en' ? r.nick_en : r.nick_ko;
  if (!b || !n) return null;
  if (b===r.body && n===r.nickname) return null;   // 원문이 그대로 캐시된 경우 → 배지 없음
  return { nick:n, body:b };
}
// 카드에 실제로 그릴 값. translated=번역본이 존재(배지 표시), showingOriginal=지금은 원문을 보는 중.
function disp(r){
  if (isNative(r,LANG)) return { nick:r.nickname, body:r.body, translated:false, showingOriginal:false };
  const tr = transOf(r,LANG);
  if (!tr) return { nick:r.nickname, body:r.body, translated:false, showingOriginal:false };
  if (SHOW_ORIG.has(r.id)) return { nick:r.nickname, body:r.body, translated:true, showingOriginal:true };
  return { nick:tr.nick, body:tr.body, translated:true, showingOriginal:false };
}
function badgeInner(r,d){
  if (!d.translated) return '';
  return '<button class="tbadge" type="button" onclick=\'toggleOriginal('+JSON.stringify(r.id)+')\'>'
    + esc(t(d.showingOriginal?'tBadgeOrig':'tBadge')) + '</button>';
}
function paintCard(r){
  const card = [...document.querySelectorAll('.card')].find(c=>c.dataset.rid===r.id);
  if (!card) return;
  const d = disp(r);
  const av=card.querySelector('.ava'), nk=card.querySelector('.nick'),
        tx=card.querySelector('.text'), sl=card.querySelector('.tslot');
  if (av) av.innerHTML = esc(((d.nick||'?')[0]||'?').toUpperCase());
  if (nk) nk.innerHTML = esc(d.nick);
  if (tx) tx.innerHTML = esc(d.body);
  if (sl) sl.innerHTML = badgeInner(r,d);
}
function toggleOriginal(id){
  const r = REVIEWS.find(x=>x.id===id); if(!r) return;
  if (SHOW_ORIG.has(id)) SHOW_ORIG.delete(id); else SHOW_ORIG.add(id);
  paintCard(r);
}
// 목록을 다시 읽어도 메모리에 있던 번역본은 잃지 않게 합친다.
function mergeTrans(fresh){
  const prev = new Map(REVIEWS.map(r=>[r.id,r]));
  (fresh||[]).forEach(r=>{ const p=prev.get(r.id); if(!p) return;
    ['lang','body_en','nick_en','body_ko','nick_ko'].forEach(k=>{ if(!r[k] && p[k]) r[k]=p[k]; }); });
  return fresh||[];
}
// 번역본이 없는 후기를 20개씩·동시 2개까지 채운다. 실패·missing_key 면 조용히 원문 유지.
async function ensureTranslations(){
  if (!CONFIGURED || transOff()) return;
  const L = LANG, seen = REQUESTED[L]; if (!seen) return;
  const need = sorted().filter(r=>!isNative(r,L) && !transOf(r,L) && !seen.has(r.id)).map(r=>r.id);
  if (!need.length) return;
  need.forEach(id=>seen.add(id));
  const chunks=[]; for(let i=0;i<need.length;i+=20) chunks.push(need.slice(i,i+20));
  const byId = new Map(REVIEWS.map(r=>[r.id,r]));
  let next = 0;
  async function worker(){
    while (next < chunks.length){
      if (transOff()) return;
      const ids = chunks[next++];
      try{
        const res = await fetch(TRANS_FN, { method:'POST',
          headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ ids, target:L }) });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.missing_key) setTransOff();       // 시크릿 없음 → 이 세션에서 더 호출하지 않음
        const items = (data && Array.isArray(data.items)) ? data.items : [];
        for (const it of items){
          const r = byId.get(it && it.id); if (!r) continue;
          if (L==='en'){ r.body_en = it.body; r.nick_en = it.nick; }
          else         { r.body_ko = it.body; r.nick_ko = it.nick; }
          if (LANG===L) paintCard(r);                       // 부분 재렌더 (깜빡임 없음)
        }
      }catch(e){ return; }                                  // 오프라인·CORS 등 → 원문 유지
    }
  }
  await Promise.all([worker(), worker()]);                  // 동시 2개
}

function sorted(){
  let a=[...REVIEWS];
  if(SORT==='top') a.sort((x,y)=>y.rating-x.rating || new Date(y.created_at)-new Date(x.created_at));
  else if(SORT==='media') a=a.filter(r=>r.media_url);
  else a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  return a;
}
function render(){
  const feed=document.getElementById('feed');
  document.getElementById('statCount').textContent = REVIEWS.length;
  document.getElementById('statAvg').textContent = REVIEWS.length? (REVIEWS.reduce((s,r)=>s+r.rating,0)/REVIEWS.length).toFixed(1) : '–';
  const list=sorted();
  if(!list.length){ feed.innerHTML='<div class="empty">'+t('empty')+'</div>'; return; }
  feed.innerHTML = list.map(r=>{
    let media='';
    if(r.media_url){
      media = r.media_type==='video'
        ? '<video class="media-vid" src="'+esc(r.media_url)+'" controls preload="metadata"></video>'
        : '<img class="media" src="'+esc(r.media_url)+'" loading="lazy" alt="">';
    }
    const d = disp(r);
    return '<div class="card" data-rid="'+esc(r.id)+'">'+media+'<div class="body">'+
      '<div class="crow"><div class="who"><div class="ava">'+esc(((d.nick||'?')[0]||'?').toUpperCase())+'</div>'+
      '<div><div class="nick">'+esc(d.nick)+'</div><div class="date">'+fmtDate(r.created_at)+'</div></div></div>'+
      '<div class="stars">'+stars(r.rating)+'</div></div>'+
      '<div class="text">'+esc(d.body)+'</div>'+
      '<div class="tslot">'+badgeInner(r,d)+'</div>'+
      '<div class="foot"><button class="mini" onclick=\'openCap('+JSON.stringify(r.id)+')\'>'+t('card')+'</button>'+
      '<button class="mini" onclick=\'shareReview('+JSON.stringify(r.id)+')\'>'+t('share')+'</button></div>'+
      '</div></div>';
  }).join('');
}

/* ============ Submit ============ */
let pickRating=0, pickFile=null;
const $=(id)=>document.getElementById(id);
function openModal(){ $('writeModal').classList.add('open'); }
function closeModals(){ document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModals(); }));
['writeTop','writeHero','writeFab'].forEach(id=>$(id).addEventListener('click',e=>{e.preventDefault();openModal();}));

$('starpick').addEventListener('click',e=>{
  if(e.target.dataset.v){ pickRating=+e.target.dataset.v;
    [...$('starpick').children].forEach((s,i)=>s.classList.toggle('on', i<pickRating)); }
});
$('drop').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const isVid=f.type.startsWith('video');
  const max=isVid?50*1024*1024:10*1024*1024;
  if(f.size>max){ toast(t('errBig')); $('file').value=''; return; }
  pickFile=f;
  const url=URL.createObjectURL(f);
  $('previewImg').style.display=isVid?'none':'block';
  $('previewVid').style.display=isVid?'block':'none';
  if(isVid) $('previewVid').src=url; else $('previewImg').src=url;
});

function cooldownLeft(){
  const last=+localStorage.getItem('rf_last')||0;
  const left = REVIEW_COOLDOWN_HOURS*3600*1000 - (Date.now()-last);
  return left>0?left:0;
}

$('reviewForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if($('website').value){ closeModals(); return; }          // honeypot tripped
  const nick=$('nick').value.trim(), body=$('body').value.trim();
  if(!pickRating||!nick||!body){ toast(t('errFields')); return; }
  if(cooldownLeft()>0){ toast(t('errCooldown')); return; }
  const btn=$('submitBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent=t('uploading');
  try{
    await Store.add({nickname:nick, rating:pickRating, body}, pickFile);
    localStorage.setItem('rf_last', Date.now());
    // 새 후기는 원문으로 바로 보인다(번역은 다음 로드·모드 전환 때). 기존 번역본은 유지.
    REVIEWS = mergeTrans(await Store.list());
    closeModals(); resetForm(); render(); toast(t('okSubmit'));
  }catch(err){ console.error(err); toast('⚠️ '+(err.message||'error')); }
  finally{ btn.disabled=false; btn.textContent=old; }
});
function resetForm(){ $('reviewForm').reset(); pickRating=0; pickFile=null;
  [...$('starpick').children].forEach(s=>s.classList.remove('on'));
  $('previewImg').style.display='none'; $('previewVid').style.display='none'; }

/* ============ Sort chips ============ */
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); SORT=c.dataset.sort; render();
}));

/* ============ Instagram card export ============ */
function openCap(id){
  const r=REVIEWS.find(x=>x.id===id); if(!r) return;
  const d=disp(r);                       // 내보내기도 현재 표시값(번역본)을 쓴다
  const stage=$('capStage');
  stage.innerHTML =
    '<div class="capcard" id="capCard">'+
      '<span class="ribbon">PLAYER REVIEW</span>'+
      '<div class="capstars">'+stars(r.rating)+'</div>'+
      '<div class="captext">"'+esc(d.body)+'"</div>'+
      '<div class="capwho"><div class="capava">'+esc(((d.nick||'?')[0]||'?').toUpperCase())+'</div>'+
      '<div class="capnick">@'+esc(d.nick)+'</div></div>'+
      '<div class="capbrand">★ '+r.rating.toFixed(1)+'</div>'+
      '<div class="caplogo" style="margin-top:60px"><span class="hl">RISING</span>-FIGHTER</div>'+
    '</div>';
  // scale 1080px card down to fit modal
  const card=$('capCard'); const scale=Math.min(1, 380/1080);
  card.style.transform='scale('+scale+')';
  stage.style.height=(card.offsetHeight*scale)+'px';
  $('capModal').classList.add('open');
}
$('capSave').addEventListener('click', async ()=>{
  const card=$('capCard'); if(!card) return;
  const prev=card.style.transform; card.style.transform='scale(1)';
  const canvas=await html2canvas(card,{backgroundColor:null,scale:1,useCORS:true});
  card.style.transform=prev;
  const a=document.createElement('a'); a.download='rising-fighter-review.png'; a.href=canvas.toDataURL('image/png'); a.click();
});

function shareReview(id){
  const url=location.origin+location.pathname+'#r='+id;
  if(navigator.share){ navigator.share({title:'Rising-fighter review', url}); }
  else { navigator.clipboard.writeText(url); toast(t('copied')); }
}

/* ============ misc ============ */
function toast(msg){ const el=$('toast'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none',2600); }
$('langBtn').addEventListener('click',()=>{
  LANG = LANG==='ko'?'en':'ko';
  try{ localStorage.setItem(LANG_KEY, LANG); localStorage.setItem('rf_lang', LANG); }catch(e){}
  applyLang();              // <html lang> 동기화 + 재렌더
  ensureTranslations();     // 바뀐 언어의 번역본 채우기
});
$('playBtn').href = BETA_URL;

(async function init(){
  if(!CONFIGURED){ const b=$('demoBanner'); b.style.display='block';
    b.textContent = (LANG==='ko'
      ? '⚙️ 데모 모드 — 후기가 이 브라우저에만 저장됩니다. Supabase 키를 넣으면 실서비스가 됩니다 (SETUP 가이드 참고).'
      : '⚙️ Demo mode — reviews are stored only in this browser. Add Supabase keys to go live.'); }
  applyLang();
  REVIEWS = await Store.list();
  render();
  ensureTranslations();     // 목록 표시 후 번역본을 채워 부분 재렌더
})();
</script>
